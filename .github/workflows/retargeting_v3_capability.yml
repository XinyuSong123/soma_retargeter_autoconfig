name: Retargeting V3 Capability Acceptance

on:
  pull_request:
    paths:
      - "soma_retargeter/robotics/v3/**"
      - "assets/robot_zoo/**"
      - "artifacts/retargeting_v3_step2_assets44/**"
      - "artifacts/retargeting_v3_step2_numerical/**"
      - "scripts/audit_retargeting_v3_capability.py"
      - "tests/v3/test_capability_acceptance_*.py"
      - "docs/retargeting_v3/STEP2_3_CAPABILITY_ACCEPTANCE.md"
      - ".github/workflows/retargeting_v3_capability.yml"
  push:
    branches:
      - retargeting-v3-step2-capability
    paths:
      - "soma_retargeter/robotics/v3/**"
      - "assets/robot_zoo/**"
      - "artifacts/retargeting_v3_step2_assets44/**"
      - "artifacts/retargeting_v3_step2_numerical/**"
      - "scripts/audit_retargeting_v3_capability.py"
      - "tests/v3/test_capability_acceptance_*.py"
      - "docs/retargeting_v3/STEP2_3_CAPABILITY_ACCEPTANCE.md"
      - ".github/workflows/retargeting_v3_capability.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .
  RETARGETING_V3_ARTIFACTS: artifacts/retargeting_v3_step2_assets44
  RETARGETING_V3_NUMERICAL_ARTIFACTS: artifacts/retargeting_v3_step2_numerical
  RETARGETING_V3_CAPABILITY_ARTIFACTS: artifacts/retargeting_v3_step2_capability

jobs:
  capability-red-team:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run capability red-team fixture tests
        run: |
          python -m pytest -q tests/v3/test_capability_acceptance_*.py
      - name: Verify Git LFS payloads
        run: |
          git lfs version
          git lfs fsck
      - name: Run live capability acceptance audit
        run: |
          mkdir -p "$RETARGETING_V3_CAPABILITY_ARTIFACTS/test_results"
          python scripts/audit_retargeting_v3_capability.py \
            --artifact-dir "$RETARGETING_V3_ARTIFACTS" \
            --numerical-artifact-dir "$RETARGETING_V3_NUMERICAL_ARTIFACTS" \
            --write-report "$RETARGETING_V3_CAPABILITY_ARTIFACTS/test_results/capability_audit.json"
