name: Retargeting V3 Step 4.1 Orientation Residual Breakthrough

on:
  pull_request:
    paths:
      - "soma_retargeter/runtime/v3/**"
      - "soma_retargeter/robotics/v3/**"
      - "soma_retargeter/tools/run_v3_full_fleet_runtime_quality.py"
      - "soma_retargeter/tools/run_v3_full_pipeline_acceptance.py"
      - "soma_retargeter/tools/step4_1_orientation_residual.py"
      - "scripts/audit_retargeting_v3_step4_1_orientation_residual_breakthrough.py"
      - "tests/v3/test_step4_1_orientation_residual_*.py"
      - "tests/v3/step4_1_orientation_residual_fixture.py"
      - "artifacts/retargeting_v3_step4_1_orientation_residual_breakthrough/**"
      - "docs/retargeting_v3/STEP4_1_ORIENTATION_RESIDUAL_BREAKTHROUGH_HANDOFF.md"
      - ".github/workflows/retargeting_v3_step4_1_orientation_residual_breakthrough.yml"
  push:
    branches:
      - retargeting-v3-step4-1-orientation-residual-breakthrough
    paths:
      - "soma_retargeter/runtime/v3/**"
      - "soma_retargeter/robotics/v3/**"
      - "soma_retargeter/tools/run_v3_full_fleet_runtime_quality.py"
      - "soma_retargeter/tools/run_v3_full_pipeline_acceptance.py"
      - "soma_retargeter/tools/step4_1_orientation_residual.py"
      - "scripts/audit_retargeting_v3_step4_1_orientation_residual_breakthrough.py"
      - "tests/v3/test_step4_1_orientation_residual_*.py"
      - "tests/v3/step4_1_orientation_residual_fixture.py"
      - "artifacts/retargeting_v3_step4_1_orientation_residual_breakthrough/**"
      - "docs/retargeting_v3/STEP4_1_ORIENTATION_RESIDUAL_BREAKTHROUGH_HANDOFF.md"
      - ".github/workflows/retargeting_v3_step4_1_orientation_residual_breakthrough.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .
  STEP4_0_BASELINE_ARTIFACTS: artifacts/retargeting_v3_step4_full_pipeline_acceptance
  STEP4_1_ARTIFACTS: artifacts/retargeting_v3_step4_1_orientation_residual_breakthrough

jobs:
  step4-1-static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy
      - name: Compile Step 4.1 sources
        run: |
          python -m py_compile \
            soma_retargeter/tools/step4_1_orientation_residual.py \
            soma_retargeter/tools/run_v3_full_pipeline_acceptance.py \
            scripts/audit_retargeting_v3_step4_1_orientation_residual_breakthrough.py
      - name: Run focused Step 4.1 tests
        run: |
          python -m pytest -q tests/v3/test_step4_1_orientation_residual_*.py

  step4-1-artifact-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit committed Step 4.1 artifacts
        run: |
          if [ ! -f "$STEP4_1_ARTIFACTS/quality_summary.json" ]; then
            echo "Step 4.1 artifact tree is not committed on this source-only revision; skipping artifact audit."
            exit 0
          fi
          python scripts/audit_retargeting_v3_step4_1_orientation_residual_breakthrough.py \
            --artifact-dir "$STEP4_1_ARTIFACTS" \
            --baseline-step4-artifact-dir "$STEP4_0_BASELINE_ARTIFACTS" \
            --source-root .

  step4-1-orientation-math-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install math dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy
      - name: Check quaternion/log-map residual math
        run: |
          python - <<'PY'
          import numpy as np
          from scipy.spatial.transform import Rotation
          from soma_retargeter.tools.step4_1_orientation_residual import rotation_log_residual

          target = Rotation.from_euler("x", 30, degrees=True).as_matrix()
          residual = rotation_log_residual(np.eye(3), target)
          assert residual["finite"] is True
          assert abs(residual["angle_radians"] - np.deg2rad(30)) < 1e-12
          assert residual["q_runtime_xyzw"][-1] >= 0
          assert residual["q_target_xyzw"][-1] >= 0
          PY

  step4-1-export-and-temporal-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check exports and temporal diagnostics if artifacts are present
        run: |
          if [ ! -f "$STEP4_1_ARTIFACTS/trajectory_export_manifest.json" ]; then
            echo "Step 4.1 trajectory exports not present on this revision."
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/retargeting_v3_step4_1_orientation_residual_breakthrough")
          manifest = json.loads((root / "trajectory_export_manifest.json").read_text())
          temporal = json.loads((root / "temporal_continuity_matrix.json").read_text())
          rows = manifest.get("exports", manifest.get("rows", []))
          assert rows
          for row in rows:
              assert row.get("finite_qpos", row.get("qpos_finite", row.get("finite"))) is True
              assert row.get("nan_count") == 0
              assert row.get("inf_count") == 0
          assert temporal.get("finite_count") == len(temporal.get("rows", []))
          PY

  step4-1-lfs-and-snapshot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify Git LFS materialization
        run: |
          git lfs version
          git lfs pull
          git lfs fsck
      - name: Verify Step 4.1 artifact shape if present
        run: |
          if [ ! -f "$STEP4_1_ARTIFACTS/quality_summary.json" ]; then
            echo "Step 4.1 artifact tree not present on this revision."
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/retargeting_v3_step4_1_orientation_residual_breakthrough")
          summary = json.loads((root / "quality_summary.json").read_text())
          model = json.loads((root / "model_matrix.json").read_text())
          assert summary["in_scope_total"] == 44
          assert summary["full_humanoid_total"] == 32
          assert summary["partial_total"] == 3
          assert summary["negative_total"] == 9
          assert summary["solver_backed_count"] >= 32
          assert summary["residual_only_count"] == 0
          assert summary["runtime_quality_failed_count"] == 0
          assert len(model["rows"]) == 44
          PY

  step4-1-pipeline-controls-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check pipeline control evidence is retained or referenced
        run: |
          if [ ! -d "$STEP4_1_ARTIFACTS" ]; then
            echo "Step 4.1 artifact tree not present on this revision."
            exit 0
          fi
          test -f "$STEP4_1_ARTIFACTS/pipeline_backed_matrix.json" || \
            test -f "$STEP4_1_ARTIFACTS/pipeline_controls_reference.json"

  step4-1-final-head-ci-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - step4-1-static-and-unit
      - step4-1-artifact-audit
      - step4-1-orientation-math-smoke
      - step4-1-export-and-temporal-smoke
      - step4-1-lfs-and-snapshot-smoke
      - step4-1-pipeline-controls-reference
    if: always()
    steps:
      - name: Record final HEAD CI evidence
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          job_conclusions = {name: data["result"] for name, data in sorted(needs.items())}
          conclusion = "success" if all(result == "success" for result in job_conclusions.values()) else "failure"
          payload = {
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "head_sha": os.environ["GITHUB_SHA"],
              "conclusion": conclusion,
              "job_conclusions": job_conclusions,
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("```json\n")
              handle.write(json.dumps(payload, indent=2, sort_keys=True))
              handle.write("\n```\n")
          if conclusion != "success":
              sys.exit(1)
          PY

