name: Retargeting v3 Step 2 Acceptance

on:
  pull_request:
  push:
    branches:
      - retargeting-v3-step2-kinematic-core
      - retargeting-v3-step2-integrated-review
  workflow_dispatch:

jobs:
  acceptance-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run Step 2 false-positive audit
        run: |
          mkdir -p artifacts/retargeting_v3_step2/test_results
          python scripts/audit_retargeting_v3_step2.py \
            --artifact-dir artifacts/retargeting_v3_step2 \
            --source-root . \
            --output-json artifacts/retargeting_v3_step2/test_results/acceptance_audit.json \
            --junit-xml artifacts/retargeting_v3_step2/test_results/acceptance_audit.junit.xml

      - name: Run pytest acceptance gates
        run: |
          python -m pytest tests/v3/test_acceptance_gates_*.py

      - name: Upload acceptance audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retargeting-v3-step2-acceptance-audit
          path: artifacts/retargeting_v3_step2/test_results/
