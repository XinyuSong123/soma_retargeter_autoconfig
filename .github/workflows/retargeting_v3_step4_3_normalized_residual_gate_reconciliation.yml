name: Retargeting V3 Step 4.3 Normalized Residual Gate Reconciliation

on:
  pull_request:
    paths:
      - "soma_retargeter/runtime/v3/**"
      - "soma_retargeter/robotics/v3/**"
      - "soma_retargeter/tools/run_v3_full_fleet_runtime_quality.py"
      - "soma_retargeter/tools/run_v3_full_pipeline_acceptance.py"
      - "soma_retargeter/tools/step4_3_normalized_residual_gate_reconciliation.py"
      - "scripts/audit_retargeting_v3_step4_3_normalized_residual_gate_reconciliation.py"
      - "tests/v3/test_step4_3_normalized_residual_gate_reconciliation_*.py"
      - "tests/v3/step4_3_normalized_residual_gate_reconciliation_fixture.py"
      - "artifacts/retargeting_v3_step4_3_normalized_residual_gate_reconciliation/**"
      - "docs/retargeting_v3/STEP4_3_NORMALIZED_RESIDUAL_GATE_RECONCILIATION_HANDOFF.md"
      - ".github/workflows/retargeting_v3_step4_3_normalized_residual_gate_reconciliation.yml"
  push:
    branches:
      - retargeting-v3-step4-3-normalized-residual-gate-reconciliation
    paths:
      - "soma_retargeter/runtime/v3/**"
      - "soma_retargeter/robotics/v3/**"
      - "soma_retargeter/tools/run_v3_full_fleet_runtime_quality.py"
      - "soma_retargeter/tools/run_v3_full_pipeline_acceptance.py"
      - "soma_retargeter/tools/step4_3_normalized_residual_gate_reconciliation.py"
      - "scripts/audit_retargeting_v3_step4_3_normalized_residual_gate_reconciliation.py"
      - "tests/v3/test_step4_3_normalized_residual_gate_reconciliation_*.py"
      - "tests/v3/step4_3_normalized_residual_gate_reconciliation_fixture.py"
      - "artifacts/retargeting_v3_step4_3_normalized_residual_gate_reconciliation/**"
      - "docs/retargeting_v3/STEP4_3_NORMALIZED_RESIDUAL_GATE_RECONCILIATION_HANDOFF.md"
      - ".github/workflows/retargeting_v3_step4_3_normalized_residual_gate_reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .
  STEP4_2_ARTIFACTS: artifacts/retargeting_v3_step4_2_orientation_policy_runtime_scoring
  STEP4_3_ARTIFACTS: artifacts/retargeting_v3_step4_3_normalized_residual_gate_reconciliation

jobs:
  step4-3-static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy
      - name: Compile Step 4.3 sources
        run: |
          python -m py_compile \
            soma_retargeter/tools/run_v3_full_pipeline_acceptance.py \
            soma_retargeter/tools/step4_3_normalized_residual_gate_reconciliation.py \
            scripts/audit_retargeting_v3_step4_3_normalized_residual_gate_reconciliation.py
      - name: Run focused Step 4.3 tests
        run: |
          python -m pytest -q tests/v3/test_step4_3_normalized_residual_gate_reconciliation_*.py

  step4-3-artifact-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit committed Step 4.3 artifacts
        run: |
          if [ ! -f "$STEP4_3_ARTIFACTS/quality_summary.json" ]; then
            echo "Step 4.3 artifact tree is not committed on this source-only revision; skipping artifact audit."
            exit 0
          fi
          python scripts/audit_retargeting_v3_step4_3_normalized_residual_gate_reconciliation.py \
            --artifact-dir "$STEP4_3_ARTIFACTS" \
            --baseline-step4-2-artifact-dir "$STEP4_2_ARTIFACTS" \
            --source-root .

  step4-3-gate-semantics-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check Step 4.3 gate semantics if artifacts are present
        run: |
          if [ ! -f "$STEP4_3_ARTIFACTS/gate_semantics_audit.json" ]; then
            echo "Step 4.3 gate semantics artifact not present on this revision."
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/retargeting_v3_step4_3_normalized_residual_gate_reconciliation")
          semantics = json.loads((root / "gate_semantics_audit.json").read_text())
          gate = json.loads((root / "gate_reconciliation_v2_report.json").read_text())
          assert semantics["legacy_gates_unchanged"] is True
          assert semantics["candidate_gates_do_not_replace_legacy_runtime_quality_passed"] is True
          assert gate["pass_gate_thresholds_unchanged_for_legacy"] is True
          PY

  step4-3-normalization-integrity-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check Step 4.3 normalization integrity if artifacts are present
        run: |
          if [ ! -f "$STEP4_3_ARTIFACTS/normalized_residual_scale_audit.json" ]; then
            echo "Step 4.3 normalization audit artifact not present on this revision."
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/retargeting_v3_step4_3_normalized_residual_gate_reconciliation")
          scale = json.loads((root / "normalized_residual_scale_audit.json").read_text())
          selection = json.loads((root / "normalization_policy_selection.json").read_text())
          assert scale["raw_residual_always_retained"] is True
          assert scale["denominator_inflation_detected"] is False
          assert scale["normalization_hides_raw_residual_regression"] is False
          assert selection["runtime_quality_passed_count_uses_legacy_gates_only"] is True
          PY

  step4-3-export-and-temporal-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check exports and temporal diagnostics if artifacts are present
        run: |
          if [ ! -f "$STEP4_3_ARTIFACTS/trajectory_export_manifest.json" ]; then
            echo "Step 4.3 trajectory exports not present on this revision."
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/retargeting_v3_step4_3_normalized_residual_gate_reconciliation")
          manifest = json.loads((root / "trajectory_export_manifest.json").read_text())
          temporal = json.loads((root / "temporal_continuity_matrix.json").read_text())
          rows = manifest.get("exports", manifest.get("rows", []))
          assert rows
          for row in rows:
              assert row.get("finite_qpos", row.get("qpos_finite", row.get("finite"))) is True
              assert row.get("nan_count") == 0
              assert row.get("inf_count") == 0
          assert temporal.get("finite_count") == len(temporal.get("rows", []))
          PY

  step4-3-lfs-and-snapshot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify Git LFS materialization
        run: |
          git lfs version
          git lfs pull
          git lfs fsck
      - name: Verify Step 4.3 artifact shape if present
        run: |
          if [ ! -f "$STEP4_3_ARTIFACTS/quality_summary.json" ]; then
            echo "Step 4.3 artifact tree not present on this revision."
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/retargeting_v3_step4_3_normalized_residual_gate_reconciliation")
          summary = json.loads((root / "quality_summary.json").read_text())
          model = json.loads((root / "model_matrix.json").read_text())
          assert summary["in_scope_total"] == 44
          assert summary["full_humanoid_total"] == 32
          assert summary["partial_total"] == 3
          assert summary["negative_total"] == 9
          assert summary["solver_backed_count"] >= 32
          assert summary["residual_only_count"] == 0
          assert summary["runtime_quality_failed_count"] == 0
          assert len(model["rows"]) == 44
          PY

  step4-3-pipeline-controls-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check pipeline control evidence is retained or referenced
        run: |
          if [ ! -d "$STEP4_3_ARTIFACTS" ]; then
            echo "Step 4.3 artifact tree not present on this revision."
            exit 0
          fi
          test -f "$STEP4_3_ARTIFACTS/pipeline_backed_matrix.json" || \
            test -f "$STEP4_3_ARTIFACTS/pipeline_controls_reference.json"

  step4-3-final-head-ci-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - step4-3-static-and-unit
      - step4-3-artifact-audit
      - step4-3-gate-semantics-smoke
      - step4-3-normalization-integrity-smoke
      - step4-3-export-and-temporal-smoke
      - step4-3-lfs-and-snapshot-smoke
      - step4-3-pipeline-controls-reference
    if: always()
    steps:
      - name: Record final HEAD CI evidence
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          job_conclusions = {name: data["result"] for name, data in sorted(needs.items())}
          conclusion = "success" if all(result == "success" for result in job_conclusions.values()) else "failure"
          payload = {
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "head_sha": os.environ["GITHUB_SHA"],
              "conclusion": conclusion,
              "job_conclusions": job_conclusions,
          }
          print("workflow_run_id", payload["workflow_run_id"])
          print("head_sha", payload["head_sha"])
          print("conclusion", payload["conclusion"])
          print("job_conclusions", json.dumps(payload["job_conclusions"], sort_keys=True))
          print(json.dumps(payload, indent=2, sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("```json\n")
              handle.write(json.dumps(payload, indent=2, sort_keys=True))
              handle.write("\n```\n")
          if conclusion != "success":
              sys.exit(1)
          PY
